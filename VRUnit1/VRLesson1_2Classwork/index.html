<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#800080"></a-box>
      <a-box position="-1.0 1.5 -3" rotation="1 0 0" color="#00FF00"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#000080"></a-sphere>
      <a-sphere position="-4 1.25 -5" radius="1.25" color="#4169E1"></a-sphere>
      <a-sphere position="4 1.25 -5" radius="1.25" color="#87CEEB"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#B22222"></a-cylinder>
      <a-cylinder position="1 0.75 -2" radius="0.5" height="1" color="#8B0000"></a-cylinder>
      <a-cylinder position="1 0.75 -1" radius="0.5" height="0.5" color="#FF2C2C"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
